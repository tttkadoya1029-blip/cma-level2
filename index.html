<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<title>CMA 2次 正誤チャレンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#f2f4f7; --sheet:#ffffff; --ink:#151d2b; --ink-2:#4f5b6d; --rule:#d6dce5;
  --accent:#2a4fa8; --accent-ink:#ffffff; --accent-soft:#e5ecfa;
  --maru:#1d5fbf; --maru-soft:#e4edfa; --batsu:#c2362f; --batsu-soft:#fbe7e5;
  --warn:#a86a00; --warn-soft:#fbf0d9; --hard:#9a2f6b; --hard-soft:#f8e6f0;
  --s-eco:#1d6a8a; --s-eco-soft:#e1f0f6; --s-cf:#2f7a4f; --s-cf-soft:#e3f2e8; --s-fa:#8a5a12; --s-fa-soft:#f6ecd9;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0f141c; --sheet:#171e2a; --ink:#e3e8f0; --ink-2:#9aa6b8; --rule:#2a3546;
  --accent:#7d9ff0; --accent-ink:#0d1526; --accent-soft:#1d2a47;
  --maru:#7aa9f0; --maru-soft:#1b2a40; --batsu:#f07a72; --batsu-soft:#3a1f1d;
  --warn:#e2b04a; --warn-soft:#3a2f17; --hard:#e48bbd; --hard-soft:#3a1d2e;
  --s-eco:#73bfdc; --s-eco-soft:#16303b; --s-cf:#7fcf9d; --s-cf-soft:#183324; --s-fa:#e0b46a; --s-fa-soft:#3a2d16; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.wrap{max-width:820px;margin:0 auto;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.brand b{font-size:20px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:22px;font-weight:900} h2{font-size:18px;font-weight:700}
h3{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em}
p{margin:0}
.muted{color:var(--ink-2);font-size:13px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:12px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:13px;min-height:36px}
.btn.wide{width:100%}
.btn.google{background:var(--sheet);color:var(--ink);border-color:var(--rule);width:100%}
.btn.danger{background:transparent;border-color:var(--batsu);color:var(--batsu)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.mark:focus-visible,input:focus-visible,select:focus-visible,.linkbtn:focus-visible,.li.click:focus-visible,.seg button:focus-visible,.toggle:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end} .row.between{justify-content:space-between}
input[type=text],input[type=email],input[type=password],input[type=number]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
label.f small{font-size:12px}
.auth{max-width:440px;width:100%;margin:0 auto}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--rule)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
/* 科目・難易度のしるし */
.subj{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.subj.eco{background:var(--s-eco-soft);color:var(--s-eco)} .subj.cf{background:var(--s-cf-soft);color:var(--s-cf)} .subj.fa{background:var(--s-fa-soft);color:var(--s-fa)}
.hard{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--hard-soft);color:var(--hard);letter-spacing:.04em;white-space:nowrap}
/* 開始画面 */
.seg{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--rule);border-radius:8px;overflow:hidden;gap:1px;background:var(--rule)}
@media (min-width:640px){.seg.four{grid-template-columns:repeat(4,1fr)}}
.seg button{font:inherit;font-size:14px;padding:10px 8px;border:0;background:var(--sheet);color:var(--ink);cursor:pointer;line-height:1.4;min-height:52px}
.seg button small{display:block;font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.8}
.toggle{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:8px;padding:12px 14px;cursor:pointer}
.toggle input{width:22px;height:22px;flex:none;accent-color:var(--hard)}
.toggle .t{display:flex;flex-direction:column;min-width:0}
.toggle .t b{font-size:15px}
.seg.five{grid-template-columns:repeat(5,1fr)}
@media (max-width:480px){.seg.five{grid-template-columns:repeat(4,1fr)}.seg.five button[data-count="all"]{grid-column:1 / -1;min-height:44px}.seg.five button[data-count="all"] small{display:inline;margin-left:6px}}
.seg button:disabled{color:var(--ink-2);opacity:.45;cursor:default}
.custom{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.custom span{white-space:nowrap}
.custom input{width:96px!important;flex:none;text-align:right;font-family:var(--f-mono)}
.summary{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.summary b{font-family:var(--f-mono);color:var(--ink);font-size:18px}
/* 出題 */
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.qmeta .l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.qno{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.unit{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stem{font-size:18px;line-height:1.85;font-weight:500}
.marks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mark{font:inherit;border:2px solid var(--rule);background:var(--sheet);border-radius:10px;padding:16px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mark .sym{font-size:44px;line-height:1;font-weight:900}
.mark .lb{font-size:13px;color:var(--ink-2)}
@media (hover:hover){.mark.m:hover:not(:disabled){border-color:var(--maru);background:var(--maru-soft)}.mark.b:hover:not(:disabled){border-color:var(--batsu);background:var(--batsu-soft)}}
.mark.m .sym{color:var(--maru)} .mark.b .sym{color:var(--batsu)} .mark.u .sym{color:var(--ink-2);font-size:36px}
.mark.u .lb{white-space:nowrap}
@media (hover:hover){.mark.u:hover:not(:disabled){border-color:var(--ink-2);background:var(--paper)}}
.mark:disabled{cursor:default;opacity:.6}
.confirm{border:1px solid var(--batsu);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--batsu-soft)}
/* 縦積みリスト */
.list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--rule);align-items:start;min-width:0}
.li:last-child{border-bottom:0}
.li .mk{font-size:20px;font-weight:900;line-height:1.3;min-width:24px;text-align:center}
.li .mk.ok{color:var(--maru)} .li .mk.ng{color:var(--batsu)} .li .mk.un{color:var(--ink-2)} .li .mk.na{color:var(--ink-2);font-size:14px}
.li .body{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.li .body>.subj,.li .body>.hard,.li .body>.tag-k{align-self:flex-start}
.tag-k{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--paper);color:var(--ink-2)}
.tag-k.ng{background:var(--batsu-soft);color:var(--batsu)}
.li .side{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.li.click{cursor:pointer}
@media (hover:hover){.li.click:hover{background:var(--accent-soft)}}
.kv{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.kv b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.rank{font-family:var(--f-mono);font-weight:600;font-size:18px;min-width:32px;text-align:center}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .v small{font-size:12px;color:var(--ink-2);font-weight:400}
.bar-cell{display:flex;align-items:center;gap:8px}
.minibar{flex:0 0 64px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--ink-2);font-weight:700;background:var(--paper)}
tbody tr:last-child td{border-bottom:0}
th.first,td.first{position:sticky;left:0;background:var(--sheet);z-index:1} th.first{background:var(--paper)}
.empty{text-align:center;padding:24px 12px;color:var(--ink-2)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.switch input{width:18px;height:18px}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px}
@media (max-width:480px){.sheet{padding:16px}.stem{font-size:17px}.mark{padding:14px 4px}.mark .sym{font-size:38px}.mark.u .sym{font-size:32px}.mark .lb{font-size:12px}h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><b>CMA 2次 正誤チャレンジ</b><span>証券アナリスト第2次レベル</span></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-view="home" aria-pressed="true">挑戦する</button>
    <button class="tab" data-view="history" aria-pressed="false">自分の記録</button>
    <button class="tab" data-view="teacher" aria-pressed="false" hidden>講師用 分析</button>
  </nav>
  <main id="app"><section class="sheet"><h2>読み込んでいます…</h2></section></main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const CFG=window.APP_CONFIG||{};
const OUTLIER_MS=300000; // 5分超は離席とみなし時間の集計から除外
const SUBJECTS=[{name:"市場と経済の分析",short:"経済",cls:"eco"},{name:"コーポレート・ファイナンス",short:"CF",cls:"cf"},{name:"財務分析",short:"財務",cls:"fa"}];
const subjCls=n=>SUBJECTS.find(s=>s.name===n)?.cls||"eco";
const S={sb:null,session:null,member:null,qlist:[],QMAP:{},qstats:{},myExams:[],myAnswers:[],
  view:"home",pick:{subject:null,count:20},exam:null,result:null,review:null,error:"",authMode:"login",authMsg:"",
  teacherData:null,teacherLoading:false,sample:false,student:null,editProfile:false};
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sec=ms=>ms==null||isNaN(ms)?"—":(ms/1000).toFixed(1)+"秒";
const pct=x=>x==null||isNaN(x)?"—":Math.round(x*100)+"%";
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const sd=a=>{const m=mean(a);if(a.length<2)return 0;return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)};
const medT=list=>median(list.filter(a=>a.ms<=OUTLIER_MS).map(a=>a.ms)); // 時間はすべて中央値
const acc=list=>list.length?list.filter(a=>a.correct).length/list.length:null;
const totalT=ms=>ms<60000?`${Math.round(ms/1000)}<small> 秒</small>`:`${Math.floor(ms/60000)}<small> 分 </small>${Math.round(ms%60000/1000)}<small> 秒</small>`;
const fmtDate=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const isTeacher=()=>S.member?.role==="teacher";
const subjTag=n=>`<span class="subj ${subjCls(n)}">${esc(n)}</span>`;
const choiceLabel=c=>c===true?"○":c===false?"×":"わからない";
const unsure=list=>list.length?list.filter(a=>a.choice==null).length/list.length:null;
const markOf=r=>r.correct?`<span class="mk ok">○</span>`:r.choice==null?`<span class="mk un" title="わからない">？</span>`:`<span class="mk ng">×</span>`;
const hardTag=l=>l==="難問"?`<span class="hard">難問</span>`:"";
const accBar=x=>`<div class="bar-cell"><span class="minibar"><i style="width:${Math.round((x||0)*100)}%"></i></span><span style="font-family:var(--f-mono)">${pct(x)}</span></div>`;

/* ===== 起動 ===== */
(async function boot(){
  if(!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes("xxxx")||!window.supabase){
    app.innerHTML=`<section class="sheet"><h2>初期設定がまだです</h2><p>config.js に Supabase の URL と anon key を貼り付けてから、もう一度開いてください。手順は README.md にあります。</p></section>`;return;
  }
  S.sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const {data}=await S.sb.auth.getSession();
  await onAuth(data.session);
  S.sb.auth.onAuthStateChange((_e,session)=>{ if((session?.user?.id)!==(S.session?.user?.id)) onAuth(session) });
})();
async function onAuth(session){
  Object.assign(S,{session,member:null,exam:null,result:null,review:null,teacherData:null,view:"home",editProfile:false});
  if(!session){$("#tabs").hidden=true;renderWho();renderAuth();return}
  app.innerHTML=`<section class="sheet"><h2>読み込んでいます…</h2></section>`;
  const [m,q]=await Promise.all([
    S.sb.from("l2_members").select("*").eq("id",session.user.id).maybeSingle(),
    S.sb.rpc("l2_question_list")
  ]);
  const err=m.error||q.error;
  if(err){app.innerHTML=`<section class="sheet"><h2>データを読み込めませんでした</h2><p class="muted">${esc(err.message)}</p><p class="muted">Supabase で supabase/schema.sql と supabase/seed.sql を実行済みか確認してください。</p></section>`;return}
  S.member=m.data;S.qlist=q.data;S.QMAP=Object.fromEntries(q.data.map(x=>[x.id,x]));
  if(S.member)await Promise.all([loadMine(),loadStats()]);
  setTab("home");render();
}
async function loadMine(){
  const [ex,an]=await Promise.all([
    fetchAll(()=>S.sb.from("l2_exams").select("*").eq("user_id",S.session.user.id).not("finished_at","is",null).order("started_at",{ascending:false})),
    fetchAll(()=>S.sb.from("l2_answers").select("exam_id,question_id,choice,is_correct,time_ms,answered_at").eq("user_id",S.session.user.id).order("id"))
  ]);
  S.myExams=ex;S.myAnswers=an.map(toAns);
}
async function loadStats(){
  const {data}=await S.sb.rpc("l2_question_stats");
  S.qstats=Object.fromEntries((data||[]).map(r=>[r.question_id,{n:+r.n,acc:+r.accuracy,med:r.median_ms==null?null:+r.median_ms,unsure:r.unsure_rate==null?null:+r.unsure_rate}]));
}
const toAns=r=>({eid:r.exam_id,qid:r.question_id,choice:r.choice,correct:r.is_correct,ms:r.time_ms,at:new Date(r.answered_at).getTime(),uid:r.user_id});
async function fetchAll(build){
  const out=[];const step=1000;
  for(let from=0;;from+=step){const {data,error}=await build().range(from,from+step-1);if(error)throw error;out.push(...data);if(data.length<step)break}
  return out;
}

/* ===== ログイン ===== */
function renderAuth(){
  const signup=S.authMode==="signup";
  app.innerHTML=`<section class="sheet auth">
    <h1>${signup?"新規登録":"ログイン"}</h1>
    <p class="muted">証券アナリスト第2次レベルの正誤問題に本番形式で挑戦し、1問ごとの解答時間と正誤を記録します。</p>
    ${S.authMsg?`<div class="note ${S.authMsg.startsWith("✓")?"info":""}">${esc(S.authMsg.replace(/^✓/,""))}</div>`:""}

function authErr(e){
  const m=e.message||"";
  if(/Invalid login credentials/i.test(m))return "メールアドレスかパスワードが違います。";
  if(/already registered/i.test(m))return "このメールアドレスは登録済みです。ログインしてください。";
  if(/Email not confirmed/i.test(m))return "メールアドレスの確認がまだです。届いたメールのリンクを押してください。";
  if(/rate limit/i.test(m))return "短時間に操作が集中しました。しばらく待ってからお試しください。";
  if(/provider is not enabled|Unsupported provider/i.test(m))return "このログイン方法はまだ使えません。メールアドレスで登録してください。";
  return "ログインできませんでした："+m;
}

    <div class="summary"><span>出題 <b>${n}</b>問</span><span>${n<pool.length?`${pool.length}問から抽選`:`範囲内の全問`}</span><span>目安 約<b>${Math.max(1,Math.round(n*myMed/60000))}</b>分</span></div>
    <button class="btn accent wide" id="start" ${n?"":"disabled"}>${n}問で開始する</button>
  </section>

  document.querySelectorAll("[data-subj]").forEach(b=>b.addEventListener("click",()=>{S.pick.subject=b.dataset.subj||null;renderHome()}));

function examRow(e){

  document.querySelectorAll("[data-exam]").forEach(r=>{const go=()=>openReview(r.dataset.exam);r.addEventListener("click",go);r.addEventListener("keydown",e=>{if(e.key==="Enter")go()})});
}

/* ===== 本番モード ===== */
let tick=null;
async function startExam(){
  $("#start").disabled=true;S.error="";
  const {data,error}=await S.sb.rpc("l2_start_exam",{p_subject:S.pick.subject,p_include_hard:true,p_limit:S.pick.count});
  if(error||!data?.length){S.error="開始できませんでした："+(error?.message||"問題がありません");render();return}
  S.exam={id:data[0].exam_id,qs:data,i:0,answers:[],queue:Promise.resolve(),failed:[],paused:0,hiddenAt:null,t0:0,locked:false,confirm:false};
  S.result=null;render();showQ();window.scrollTo(0,0);
}
function showQ(){
  const x=S.exam;x.locked=false;x.paused=0;x.hiddenAt=null;x.confirm=false;
  renderExam();x.t0=performance.now();clearInterval(tick);
  tick=setInterval(()=>{const el=$("#tm");if(el&&!x.locked)el.textContent=fmtT(elapsed())},100);
}
function elapsed(){const x=S.exam;let p=x.paused;if(x.hiddenAt)p+=performance.now()-x.hiddenAt;return Math.max(0,performance.now()-x.t0-p)}
const fmtT=ms=>{const s=ms/1000;return s<60?s.toFixed(1):Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")};
function renderExam(){
  const x=S.exam,q=x.qs[x.i];
  app.innerHTML=`<section class="sheet">
    <div class="qmeta"><span class="l"><span class="qno">${x.i+1} / ${x.qs.length}</span>${subjTag(q.subject)}</span>
      <span class="timer" id="tm" aria-label="経過時間">0.0</span></div>
    <div class="unit"><span>${esc(q.unit)}</span></div>
    <div class="progress"><i style="width:${(x.i/x.qs.length)*100}%"></i></div>
    <p class="stem">${esc(q.stem)}</p>
    <div class="marks">
      <button class="mark m" id="ans-true"><span class="sym">○</span><span class="lb">正しい</span></button>
      <button class="mark b" id="ans-false"><span class="sym">×</span><span class="lb">誤り</span></button>
      <button class="mark u" id="ans-unsure"><span class="sym">？</span><span class="lb">わからない</span></button>
    </div>
    ${x.failed.length?`<div class="note">${x.failed.length}問分の記録を送信できていません。通信が戻ると自動で再送します。</div>`:""}
    ${x.confirm?`<div class="confirm"><b>ここで終了して採点しますか？</b><span class="muted">解答済みの ${x.answers.length}問だけを採点します。この問題は記録されません。</span>
      <div class="row"><button class="btn danger small" id="stopYes">終了して採点する</button><button class="btn ghost small" id="stopNo">続ける</button></div></div>`
      :`<div class="row end"><button class="linkbtn" id="stop">ここで終了して採点する</button></div>`}
  </section>`;
  $("#ans-true").addEventListener("click",()=>answer(true));
  $("#ans-false").addEventListener("click",()=>answer(false));
  $("#ans-unsure").addEventListener("click",()=>answer(null));
  $("#stop")?.addEventListener("click",()=>{x.confirm=true;const t=$("#tm").textContent;renderExam();$("#tm").textContent=t});
  $("#stopNo")?.addEventListener("click",()=>{x.confirm=false;const t=$("#tm").textContent;renderExam();$("#tm").textContent=t});
  $("#stopYes")?.addEventListener("click",finishExam);
}
function answer(v){
  const x=S.exam;if(x.locked)return;
  x.locked=true;clearInterval(tick);
  const q=x.qs[x.i],ms=Math.round(elapsed());
  x.answers.push({qid:q.id,choice:v,ms});
  enqueue(x,{qid:q.id,choice:v,ms});
  if(x.i+1<x.qs.length){x.i++;showQ();window.scrollTo(0,0)}else finishExam();
}
function enqueue(x,a){ // 送信は順番に裏で行う。失敗したら控えておき、次の送信時と終了時に再送する
  x.queue=x.queue.then(async()=>{
    const todo=[...x.failed,a];x.failed=[];
    for(const t of todo){
      const {error}=await S.sb.rpc("l2_submit_answer",{p_exam:x.id,p_question:t.qid,p_choice:t.choice,p_time_ms:t.ms});
      if(error)x.failed.push(t);
    }
  });
}
async function finishExam(){
  const x=S.exam;clearInterval(tick);x.locked=true;
  app.innerHTML=`<section class="sheet"><h2>採点しています…</h2></section>`;
  await x.queue;
  if(x.failed.length){enqueue(x,x.failed.pop());await x.queue}
  if(x.failed.length){
    app.innerHTML=`<section class="sheet"><h2>記録を送信できませんでした</h2><p>${x.failed.length}問分の解答がまだ送信できていません。通信状況を確認して、もう一度お試しください。</p><button class="btn accent" id="retry">もう一度送信する</button></section>`;
    $("#retry").addEventListener("click",finishExam);return;
  }
  const {data,error}=await S.sb.rpc("l2_finish_exam",{p_exam:x.id});
  if(error){app.innerHTML=`<section class="sheet"><h2>採点できませんでした</h2><p class="muted">${esc(error.message)}</p><button class="btn accent" id="retry">もう一度</button></section>`;$("#retry").addEventListener("click",finishExam);return}
  S.result={examId:x.id,subject:S.pick.subject,count:S.pick.count,total:x.qs.length,rows:data.map(r=>({qid:r.question_id,choice:r.choice,correct:r.is_correct,ms:r.time_ms,answer:r.answer,exp:r.explanation})),filter:"all",fromHistory:false};
  S.exam=null;
  await Promise.all([loadMine(),loadStats()]);S.teacherData=null;
  render();window.scrollTo(0,0);
}

/* ===== 結果・振り返り ===== */
async function openReview(examId){
  const e=S.myExams.find(x=>x.id===examId)||S.teacherData?.exams.find(x=>x.id===examId);
  app.innerHTML=`<section class="sheet"><h2>読み込んでいます…</h2></section>`;
  const {data,error}=await S.sb.rpc("l2_review",{p_exam:examId});
  if(error){S.error="結果を読み込めませんでした："+error.message;render();return}
  S.result={examId,subject:e?.subject,total:e?.question_count||data.length,startedAt:e?.started_at,
    rows:data.map(r=>({qid:r.question_id,choice:r.choice,correct:r.is_correct,ms:r.time_ms,answer:r.answer,exp:r.explanation})),filter:"all",fromHistory:true};
  render();window.scrollTo(0,0);
}
function breakdown(rows,key){
  const g={};rows.forEach(r=>{const k=key(r);(g[k]=g[k]||[]).push(r)});return g;
}
function renderResult(){
  const R=S.result,rows=R.rows,score=rows.filter(r=>r.correct).length;

    <div class="tags">${R.subject?subjTag(R.subject):`<span class="muted">全科目</span>`}${R.startedAt?`<span class="muted">${fmtDate(R.startedAt)}</span>`:""}</div>
    <h1>${score} / ${rows.length} 問正解${rows.length<R.total?`<span class="muted" style="font-size:14px;font-weight:400">（${R.total}問中 ${rows.length}問に解答）</span>`:""}</h1>
    <div class="stats">
      <div class="stat"><div class="k">正答率</div><div class="v">${pct(rows.length?score/rows.length:null)}</div></div>

      <div class="stat"><div class="k">時間（中央値）</div><div class="v">${sec(medT(rows)).replace("秒","")}<small> 秒</small></div></div>
      <div class="stat"><div class="k">合計時間</div><div class="v">${totalT(rows.reduce((a,b)=>a+b.ms,0))}</div></div>
    </div>
    <h3>科目別</h3>
    <div class="list">${SUBJECTS.filter(s=>bySubj[s.name]).map(s=>{const a=bySubj[s.name];return `<div class="li"><span class="mk na"></span><div class="body">${subjTag(s.name)}<div class="kv"><span>正答率 <b>${pct(acc(a))}</b></span><span>わからない <b>${pct(unsure(a))}</b></span><span>時間 <b>${sec(medT(a))}</b></span></div></div><span class="side">${a.filter(x=>x.correct).length}/${a.length}</span></div>`}).join("")}</div>
    <div class="row">${R.fromHistory?`<button class="btn ghost" id="back">記録に戻る</button>`:`<button class="btn ghost" id="home">トップへ</button>`}<button class="btn accent" id="again">同じ条件でもう一度</button></div>
  </section>
  <section class="sheet"><div class="row between"><h2>問題ごとの結果</h2>
    <div class="seg" role="group" style="min-width:260px"><button data-f="all" aria-pressed="${R.filter==="all"}">すべて</button><button data-f="wrong" aria-pressed="${R.filter==="wrong"}">間違い・わからない</button></div></div>
    ${shown.length?`<div class="list">${shown.map(r=>{const q=S.QMAP[r.qid]||{},st=S.qstats[r.qid];return `<div class="li">${markOf(r)}
      <div class="body"><div class="tags">${subjTag(q.subject)}</div><span class="muted">${esc(q.unit)}・${esc(q.point_code)} ${esc(q.point_title)}</span><span>${esc(q.stem)}</span>
        <details ${r.correct?"":"open"}><summary>正答 ${r.answer?"○":"×"}／あなた ${choiceLabel(r.choice)}　解説</summary><p style="margin-top:4px;font-size:14px">${esc(r.exp)}</p></details>
        <div class="kv"><span>みんなの正答率 <b>${pct(st?.acc)}</b></span><span>みんなの「わからない」 <b>${pct(st?.unsure)}</b></span><span>みんなの時間 <b>${sec(st?.med)}</b></span></div></div>
      <span class="side">${sec(r.ms)}</span></div>`}).join("")}</div>`:`<div class="empty">間違えた問題・わからなかった問題はありません。</div>`}
  </section>`;
  $("#home")?.addEventListener("click",()=>{S.result=null;setTab("home");render();window.scrollTo(0,0)});
  $("#back")?.addEventListener("click",()=>{S.result=null;render();window.scrollTo(0,0)});
  $("#again").addEventListener("click",()=>{S.pick={subject:R.subject||null,count:R.count!==undefined?R.count:R.total};S.result=null;setTab("home");render();startExam()});
  document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{S.result.filter=b.dataset.f;renderResult()}));
}

/* ===== 自分の記録 ===== */
function renderHistory(){
  const A=S.myAnswers;
  const pts={};A.forEach(a=>{const q=S.QMAP[a.qid];if(!q)return;const k=q.point_code;(pts[k]=pts[k]||{q,list:[]}).list.push(a)});
  const weak=Object.values(pts).map(p=>({...p,acc:acc(p.list)})).filter(p=>p.acc<0.6).sort((a,b)=>a.acc-b.acc).slice(0,8);
  app.innerHTML=`<section class="sheet"><h1>自分の記録</h1>
    ${A.length?`<div class="stats">
      <div class="stat"><div class="k">解答数</div><div class="v">${A.length}<small> 問</small></div></div>
      <div class="stat"><div class="k">正答率</div><div class="v">${pct(acc(A))}</div></div>
      <div class="stat"><div class="k">わからない</div><div class="v">${pct(unsure(A))}</div></div>
      <div class="stat"><div class="k">時間（中央値）</div><div class="v">${sec(medT(A)).replace("秒","")}<small> 秒</small></div></div>
      <div class="stat"><div class="k">挑戦回数</div><div class="v">${S.myExams.length}<small> 回</small></div></div></div>
    <h3>科目別（あなた／みんな）</h3>
    <div class="list">${SUBJECTS.map(s=>{const a=A.filter(x=>S.QMAP[x.qid]?.subject===s.name);const all=allStats(q=>q.subject===s.name);return `<div class="li"><span class="mk na"></span><div class="body">${subjTag(s.name)}
      <div class="kv"><span>正答率 <b>${pct(acc(a))}</b> / ${pct(all.acc)}</span><span>わからない <b>${pct(unsure(a))}</b> / ${pct(all.unsure)}</span><span>時間 <b>${sec(medT(a))}</b> / ${sec(all.med)}</span></div></div><span class="side">${a.length}問</span></div>`}).join("")}</div>
    ${weak.length?`<h3>苦手な学習ポイント（正答率60%未満）</h3><div class="list">${weak.map(p=>`<div class="li"><span class="mk ng">!</span><div class="body"><div class="tags">${subjTag(p.q.subject)}</div><b>${esc(p.q.point_code)} ${esc(p.q.point_title)}</b><span class="muted">${esc(p.q.unit)}</span></div><span class="side">${pct(p.acc)}<br>${p.list.length}問</span></div>`).join("")}</div>`:""}
    <p class="muted">「わからない」は不正解として採点しています。時間はすべて中央値で、5分を超えた解答は離席とみなして時間の集計から除いています。</p>`
    :`<div class="empty">まだ記録がありません。「挑戦する」から始めましょう。</div>`}
  </section>
  ${S.myExams.length?`<section class="sheet"><h2>挑戦の履歴</h2><p class="muted">押すと問題ごとの結果と解説を見られます。</p><div class="list">${S.myExams.map(examRow).join("")}</div></section>`:""}`;
  bindExamRows();
}
function allStats(filter){ // 問題ごとの集計値から、みんなの正答率と時間（解答数で重みづけ）を出す
  let n=0,c=0,u=0;const meds=[];
  S.qlist.filter(filter).forEach(q=>{const s=S.qstats[q.id];if(!s)return;n+=s.n;c+=s.acc*s.n;u+=(s.unsure||0)*s.n;if(s.med!=null)meds.push(s.med)});
  return {acc:n?c/n:null,unsure:n?u/n:null,med:median(meds)};
}

/* ===== 講師用 分析 ===== */
async function loadTeacher(){
  if(S.teacherLoading)return;S.teacherLoading=true;
  try{
    const [members,exams,answers]=await Promise.all([
      fetchAll(()=>S.sb.from("l2_members").select("*").order("created_at")),
      fetchAll(()=>S.sb.from("l2_exams").select("*").order("started_at",{ascending:false})),
      fetchAll(()=>S.sb.from("l2_answers").select("user_id,exam_id,question_id,choice,is_correct,time_ms,answered_at").order("id"))
    ]);
    S.teacherData={members,exams,answers:answers.map(toAns)};S.error="";
  }catch(e){S.error="分析データを読み込めませんでした："+e.message}
  S.teacherLoading=false;if(S.view==="teacher")render();
}
function sampleData(){ // 画面確認用の架空データ（保存しない）
  const names=[["サンプルA","見本 一郎"],["サンプルB","見本 二郎"],["サンプルC","見本 三子"],["サンプルD","見本 四郎"],["サンプルE","見本 五子"]];
  let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const skill=[.85,.7,.6,.5,.75],speed=[25,35,30,50,20],bias=[{},{"財務分析":-.2},{"市場と経済の分析":-.25},{},{"コーポレート・ファイナンス":-.2}];
  const members=names.map((n,k)=>({id:"s"+k,nickname:n[0],full_name:n[1],email:`sample${k+1}@example.com`,role:"student",created_at:new Date().toISOString()}));
  const answers=[];
  members.forEach((m,k)=>S.qlist.forEach(q=>{const p=Math.max(.1,Math.min(.97,skill[k]+(bias[k][q.subject]||0)-(q.level==="難問"?.15:0)));
    const r=rnd(),ok=r<p,un=!ok&&rnd()<.35;answers.push({uid:m.id,eid:"e"+k,qid:q.id,correct:ok,choice:ok?true:un?null:false,ms:Math.round((speed[k]+rnd()*25)*(q.level==="難問"?1.5:1)*1000)})}));
  return {members,exams:members.map((m,k)=>({id:"e"+k,user_id:m.id})),answers};
}
function teacherModel(TD){
  const by={};TD.answers.forEach(a=>{(by[a.uid]=by[a.uid]||[]).push(a)});
  const st=TD.members.map(m=>({m,ans:by[m.id]||[],exams:TD.exams.filter(e=>e.user_id===m.id).length})).filter(s=>s.ans.length);
  st.forEach(s=>{s.acc=acc(s.ans);s.un=unsure(s.ans);s.t=medT(s.ans);s.subj=SUBJECTS.map(x=>{const a=s.ans.filter(y=>S.QMAP[y.qid]?.subject===x.name);return {name:x.name,n:a.length,acc:acc(a),un:unsure(a),t:medT(a)}})});
  const accs=st.map(s=>s.acc),mu=mean(accs),sg=sd(accs);
  st.forEach(s=>{s.dev=sg>0?50+10*(s.acc-mu)/sg:50});st.sort((a,b)=>b.dev-a.dev);
  const qs=S.qlist.map(q=>{const a=TD.answers.filter(x=>x.qid===q.id);return {q,n:a.length,acc:acc(a),un:unsure(a),t:medT(a)}});
  const subjAll=SUBJECTS.map(x=>{const a=TD.answers.filter(y=>S.QMAP[y.qid]?.subject===x.name);return {name:x.name,acc:acc(a),un:unsure(a),t:medT(a)}});
  return {st,qs,subjAll,all:TD.answers,classAcc:mu};
}
function renderTeacher(){
  if(!S.teacherData&&!S.sample){
    app.innerHTML=`<section class="sheet"><h1>講師用 分析</h1>${S.error?`<div class="note">${esc(S.error)}</div><button class="btn" id="rl">再読み込み</button>`:`<p class="muted">集計しています…</p>`}</section>`;
    $("#rl")?.addEventListener("click",()=>{S.error="";loadTeacher();render()});if(!S.error)loadTeacher();return;
  }
  const TD=S.sample?sampleData():S.teacherData,M=teacherModel(TD);
  if(S.student){const s=M.st.find(x=>x.m.id===S.student);if(s){renderStudent(s,M);return}S.student=null}
  const has=M.st.length>0;
  app.innerHTML=`<section class="sheet">
    <div class="row between"><h1>講師用 分析</h1><button class="btn ghost small" id="rl">最新にする</button></div>
    <label class="switch"><input type="checkbox" id="smp" ${S.sample?"checked":""}> サンプルデータで表示</label>
    ${S.sample?`<div class="note">サンプル表示中です。架空の5名分のデータで、実際の記録ではありません。</div>`:`<p class="muted">登録者 ${TD.members.length} 名</p>`}
    ${has?`<div class="stats">
      <div class="stat"><div class="k">解答した人</div><div class="v">${M.st.length}<small> 名</small></div></div>
      <div class="stat"><div class="k">総解答数</div><div class="v">${M.all.length}</div></div>
      <div class="stat"><div class="k">全体正答率</div><div class="v">${pct(acc(M.all))}</div></div>
      <div class="stat"><div class="k">時間（中央値）</div><div class="v">${sec(medT(M.all)).replace("秒","")}<small> 秒</small></div></div></div>
      <div class="row"><button class="btn ghost small" id="csv">解答データをCSVで書き出す</button></div>`
    :`<div class="empty">まだ解答の記録がありません。サイトのURLを受講者に送り、登録して挑戦してもらうとここに集計されます。</div>`}
  </section>
  ${has?`<section class="sheet"><h2>受講者一覧</h2>
    <p class="muted">偏差値は全員の正答率から算出（50＋10×（本人−平均）÷標準偏差）。時間は中央値。押すと個別の分析を表示します。</p>
    <div class="list">${M.st.map(s=>`<div class="li click" tabindex="0" data-uid="${esc(s.m.id)}"><span class="rank">${s.dev.toFixed(0)}</span>
      <div class="body"><b>${esc(s.m.nickname)}<span class="muted" style="font-weight:400">（${esc(s.m.full_name)}）</span></b><span class="muted">${esc(s.m.email)}</span>
      <div class="kv"><span>正答率 <b>${pct(s.acc)}</b></span><span>わからない <b>${pct(s.un)}</b></span><span>時間 <b>${sec(s.t)}</b></span><span><b>${s.ans.length}</b>問・${s.exams}回</span></div></div><span class="side">偏差値</span></div>`).join("")}</div></section>
  <section class="sheet"><h2>科目 × 受講者</h2><p class="muted">正答率・「わからない」の割合・時間（中央値）。表は横にスクロールできます。</p>
    <div class="tbl"><table><thead><tr><th class="first">受講者</th>${SUBJECTS.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead>
    <tbody>${M.st.map(s=>`<tr><td class="first">${esc(s.m.nickname)}</td>${s.subj.map(x=>`<td>${x.n?`${accBar(x.acc)}<span class="muted">わからない${pct(x.un)}・${sec(x.t)}・${x.n}問</span>`:"—"}</td>`).join("")}</tr>`).join("")}
    <tr><td class="first"><b>全体</b></td>${M.subjAll.map(x=>`<td>${accBar(x.acc)}<span class="muted">わからない${pct(x.un)}・${sec(x.t)}</span></td>`).join("")}</tr></tbody></table></div></section>
  <section class="sheet"><h2>問題別（正答率が低い順）</h2>
    <div class="list">${[...M.qs].filter(x=>x.n).sort((a,b)=>a.acc-b.acc).map(x=>`<div class="li"><span class="mk na" style="font-family:var(--f-mono);font-size:12px">${esc(x.q.id)}</span>
      <div class="body"><div class="tags">${subjTag(x.q.subject)}${hardTag(x.q.level)}</div><span>${esc(x.q.stem)}</span>
      <div class="kv"><span>正答率 <b>${pct(x.acc)}</b></span><span>わからない <b>${pct(x.un)}</b></span><span>時間 <b>${sec(x.t)}</b></span><span><b>${x.n}</b>件</span></div></div><span></span></div>`).join("")}</div></section>`:""}`;
  $("#smp").addEventListener("change",e=>{S.sample=e.target.checked;render()});
  $("#rl").addEventListener("click",async()=>{S.teacherData=null;S.sample=false;await loadStats();render()});
  $("#csv")?.addEventListener("click",()=>downloadCsv(TD));
  document.querySelectorAll(".li.click[data-uid]").forEach(r=>{const go=()=>{S.student=r.dataset.uid;render();window.scrollTo(0,0)};r.addEventListener("click",go);r.addEventListener("keydown",e=>{if(e.key==="Enter")go()})});
}
function renderStudent(s,M){
  const pts={};s.ans.forEach(a=>{const q=S.QMAP[a.qid];if(!q)return;(pts[q.point_code]=pts[q.point_code]||{q,list:[]}).list.push(a)});
  const weak=Object.values(pts).map(p=>({...p,acc:acc(p.list),un:unsure(p.list),t:medT(p.list)})).sort((a,b)=>a.acc-b.acc||(b.t||0)-(a.t||0)).slice(0,10);
  const kind=p=>p.acc>=0.6?"":p.un>=0.5?`<span class="tag-k">知識不足（わからないが多い）</span>`:`<span class="tag-k ng">思い違い（×が多い）</span>`;
  app.innerHTML=`<section class="sheet">
    <div class="row"><button class="btn ghost small" id="back">← 一覧へ戻る</button></div>
    <h1>${esc(s.m.nickname)} さん</h1><p class="muted">${esc(s.m.full_name)}・${esc(s.m.email)}</p>
    ${S.sample?`<div class="note">サンプル表示中（架空のデータ）</div>`:""}
    <div class="stats">
      <div class="stat"><div class="k">偏差値</div><div class="v">${s.dev.toFixed(1)}</div></div>
      <div class="stat"><div class="k">正答率（全体）</div><div class="v">${pct(s.acc)}<small> ${pct(M.classAcc)}</small></div></div>
      <div class="stat"><div class="k">時間（中央値）</div><div class="v">${sec(s.t).replace("秒","")}<small> 秒</small></div></div>
      <div class="stat"><div class="k">わからない</div><div class="v">${pct(s.un)}</div></div></div></section>
  <section class="sheet"><h2>科目別（本人／全体）</h2>
    <div class="list">${s.subj.map((x,i)=>`<div class="li"><span class="mk na"></span><div class="body">${subjTag(x.name)}<div class="kv"><span>正答率 <b>${pct(x.acc)}</b> / ${pct(M.subjAll[i].acc)}</span><span>わからない <b>${pct(x.un)}</b> / ${pct(M.subjAll[i].un)}</span><span>時間 <b>${sec(x.t)}</b> / ${sec(M.subjAll[i].t)}</span></div></div><span class="side">${x.n}問</span></div>`).join("")}</div></section>
  <section class="sheet"><h2>指導の優先順位（学習ポイント別・正答率が低い順）</h2>
    <div class="list">${weak.map((p,i)=>`<div class="li"><span class="rank">${i+1}</span><div class="body"><div class="tags">${subjTag(p.q.subject)}</div><b>${esc(p.q.point_code)} ${esc(p.q.point_title)}</b><span class="muted">${esc(p.q.unit)}</span>${kind(p)}</div><span class="side">${pct(p.acc)}<br>${sec(p.t)}</span></div>`).join("")}</div></section>`;
  $("#back").addEventListener("click",()=>{S.student=null;render()});
}
function downloadCsv(TD){
  const mm=Object.fromEntries(TD.members.map(m=>[m.id,m]));
  const head=["ニックネーム","お名前","メールアドレス","受験ID","問題ID","科目","回","学習ポイント","難易度","解答","正誤","解答時間(秒)","解答日時"];
  const cell=v=>{const s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[head.join(",")].concat(TD.answers.map(a=>{const m=mm[a.uid]||{},q=S.QMAP[a.qid]||{};
    return [m.nickname,m.full_name,m.email,a.eid,a.qid,q.subject,q.unit,(q.point_code||"")+" "+(q.point_title||""),q.level,choiceLabel(a.choice),a.correct?"正解":"不正解",(a.ms/1000).toFixed(1),a.at?new Date(a.at).toLocaleString("ja-JP"):""].map(cell).join(",")}));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`cma-level2-answers-${new Date().toISOString().slice(0,10)}.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
</script>
